services:
  - type: web
    name: startup-consultant-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false

  - type: worker
    name: startup-consultant-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.celery_app worker --pool=solo --loglevel=info
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        sync: false

databases:
  - name: startup-consultant-db
    databaseName: startup_consultant
    user: postgres
